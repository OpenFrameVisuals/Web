<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenFrame Admin | Studio Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #050505;
      color: #ffffff;
    }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-white selection:text-black">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-6">
    <div class="glass p-8 md:p-10 rounded-3xl w-full max-w-md text-center">
      <svg class="w-12 h-12 text-white mx-auto mb-4" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5">
        <path d="M10 30 V10 H30 M70 10 H90 V30 M90 70 V90 H70 M30 90 H10 V70" />
        <path d="M58 28 A24 24 0 1 0 38 72 L62 42 H76 M62 42 V75" stroke-width="6" stroke-linecap="square" />
      </svg>
      <h1 class="text-sm font-semibold tracking-[0.3em] mb-1">OPENFRAME STUDIO</h1>
      <p class="text-[10px] tracking-[0.3em] text-zinc-400 mb-8">ADMIN CONTROL PANEL</p>

      <form id="login-form" class="space-y-4 text-left">
        <div>
          <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-1.5">ADMIN EMAIL</label>
          <input type="email" id="admin-email" required class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs focus:outline-none focus:border-white">
        </div>
        <div>
          <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-1.5">PASSWORD</label>
          <input type="password" id="admin-pass" required class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs focus:outline-none focus:border-white">
        </div>
        <button type="submit" id="login-btn" class="w-full py-3.5 bg-white text-black text-xs font-semibold tracking-[0.25em] rounded-xl hover:bg-zinc-200 transition mt-2">
          ACCESS DASHBOARD
        </button>
        <p id="login-error" class="text-xs text-red-400 text-center hidden"></p>
      </form>
      <a href="index.html" class="inline-block mt-6 text-[10px] tracking-[0.2em] text-zinc-500 hover:text-white">← BACK TO WEBSITE</a>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="hidden">
    <header class="glass border-b border-white/10 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-xs font-semibold tracking-[0.28em]">OPENFRAME</span>
          <span class="px-2.5 py-1 rounded-full bg-white/10 text-[9px] tracking-[0.2em] text-zinc-300">BACKEND</span>
        </div>
        <div class="flex items-center gap-4">
          <a href="index.html" target="_blank" class="text-[10px] tracking-[0.2em] text-zinc-400 hover:text-white">VIEW LIVE SITE ↗</a>
          <button id="logout-btn" class="px-4 py-2 glass rounded-full text-[10px] tracking-[0.2em] hover:bg-red-500/20 hover:text-red-300 transition">
            LOGOUT
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
      <!-- Tabs -->
      <div class="flex flex-wrap gap-3 mb-10">
        <button data-tab="bookings-tab" class="tab-btn px-6 py-2.5 rounded-full bg-white text-black text-xs font-semibold tracking-[0.2em]">
          BOOKINGS & SCHEDULE
        </button>
        <button data-tab="portfolio-tab" class="tab-btn px-6 py-2.5 rounded-full glass text-zinc-300 text-xs tracking-[0.2em]">
          PORTFOLIO MANAGER
        </button>
        <button data-tab="packages-tab" class="tab-btn px-6 py-2.5 rounded-full glass text-zinc-300 text-xs tracking-[0.2em]">
          SERVICE PACKAGES
        </button>
      </div>

      <!-- TAB 1: BOOKINGS & SCHEDULE -->
      <section id="bookings-tab" class="tab-content space-y-8">
        <div class="glass p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
          <div>
            <h3 class="text-xs font-semibold tracking-[0.2em]">MANUAL CALENDAR LOCK</h3>
            <p class="text-[11px] text-zinc-400 mt-1">Block dates booked via Instagram DM or phone calls.</p>
          </div>
          <form id="block-date-form" class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            <input type="date" id="manual-date" required class="px-4 py-2.5 rounded-xl bg-zinc-900 border border-white/15 text-xs">
            <input type="text" id="manual-note" placeholder="Client / Note (e.g. IG Booking)" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs">
            <button type="submit" class="px-5 py-2.5 bg-white text-black text-xs font-semibold tracking-[0.15em] rounded-xl">
              BLOCK DATE
            </button>
          </form>
        </div>

        <div class="glass rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-white/10 text-[10px] tracking-[0.2em] text-zinc-400 bg-white/[0.02]">
                  <th class="p-4">DATE</th>
                  <th class="p-4">CLIENT</th>
                  <th class="p-4">PACKAGE</th>
                  <th class="p-4">NOTES</th>
                  <th class="p-4">STATUS</th>
                  <th class="p-4 text-right">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="admin-bookings-list" class="divide-y divide-white/5 text-xs"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- TAB 2: PORTFOLIO MANAGER -->
      <section id="portfolio-tab" class="tab-content hidden space-y-8">
        <div class="glass p-6 md:p-8 rounded-3xl">
          <h3 class="text-xs font-semibold tracking-[0.25em] mb-6">UPLOAD NEW WORK</h3>
          <form id="upload-portfolio-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">PROJECT TITLE *</label>
              <input type="text" id="work-title" required placeholder="e.g. Ella Drone Sunset" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs">
            </div>
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">CATEGORY *</label>
              <select id="work-category" class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-white/10 text-xs">
                <option value="photography">Photography</option>
                <option value="films">Cinematography / Films</option>
                <option value="aerials">Aerials (Drone)</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">PHOTO / THUMBNAIL IMAGE *</label>
              <input type="file" id="work-file" accept="image/*" required class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs file:mr-4 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:text-xs file:bg-white file:text-black">
            </div>
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">YOUTUBE / VIMEO LINK (OPTIONAL FOR FILMS)</label>
              <input type="url" id="work-video" placeholder="https://youtube.com/watch?v=..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs">
            </div>
            <div class="md:col-span-2">
              <button type="submit" id="upload-btn" class="px-8 py-3.5 bg-white text-black text-xs font-semibold tracking-[0.25em] rounded-xl hover:bg-zinc-200 transition">
                COMPRESS & PUBLISH TO WEBSITE
              </button>
            </div>
          </form>
        </div>

        <div id="admin-portfolio-grid" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
      </section>

      <!-- TAB 3: PACKAGES MANAGER -->
      <section id="packages-tab" class="tab-content hidden space-y-8">
        <div class="glass p-6 md:p-8 rounded-3xl">
          <h3 class="text-xs font-semibold tracking-[0.25em] mb-6">ADD SERVICE PACKAGE</h3>
          <form id="add-package-form" class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">PACKAGE NAME *</label>
              <input type="text" id="pkg-name" required placeholder="Wedding Gold" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs">
            </div>
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">CATEGORY *</label>
              <input type="text" id="pkg-cat" required placeholder="PHOTOGRAPHY / FILMS" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs">
            </div>
            <div>
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">PRICE (LKR) *</label>
              <input type="text" id="pkg-price" required placeholder="75,000" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs">
            </div>
            <div class="md:col-span-3">
              <label class="block text-[10px] tracking-[0.2em] text-zinc-400 mb-2">FEATURES (COMMA SEPARATED) *</label>
              <input type="text" id="pkg-features" required placeholder="8 Hours Coverage, 300 Edited Photos, 4K Drone Shots" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-xs">
            </div>
            <div class="md:col-span-3">
              <button type="submit" class="px-8 py-3.5 bg-white text-black text-xs font-semibold tracking-[0.25em] rounded-xl">
                ADD PACKAGE
              </button>
            </div>
          </form>
        </div>

        <div id="admin-packages-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </section>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5s9kytW7yte1jglGzoa-xhmdwl-aUa5w",
      authDomain: "openframevisuals-bd5c7.firebaseapp.com",
      projectId: "openframevisuals-bd5c7",
      storageBucket: "openframevisuals-bd5c7.firebasestorage.app",
      messagingSenderId: "861131525271",
      appId: "1:861131525271:web:98cedbd90e3d29a0b5edd2",
      measurementId: "G-MJLMB74DTY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        loadAllAdminData();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-pass').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      btn.textContent = 'AUTHENTICATING...';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        errEl.classList.add('hidden');
      } catch (err) {
        errEl.textContent = "Login Failed: " + err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'ACCESS DASHBOARD';
      }
    });

    document.getElementById('logout-btn').onclick = () => signOut(auth);

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-white', 'text-black', 'font-semibold');
          b.classList.add('glass', 'text-zinc-300');
        });
        btn.classList.add('bg-white', 'text-black', 'font-semibold');
        btn.classList.remove('glass', 'text-zinc-300');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });

    function compressImage(file, maxWidth = 1600, quality = 0.82) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(blob), 'image/webp', quality);
          };
        };
      });
    }

    document.getElementById('upload-portfolio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('upload-btn');
      const file = document.getElementById('work-file').files[0];
      if (!file) return;

      btn.disabled = true;
      btn.textContent = 'COMPRESSING & UPLOADING...';

      try {
        const compressedBlob = await compressImage(file);
        const fileRef = ref(storage, `portfolio/${Date.now()}.webp`);
        await uploadBytes(fileRef, compressedBlob);
        const imageUrl = await getDownloadURL(fileRef);

        await addDoc(collection(db, "portfolio"), {
          title: document.getElementById('work-title').value,
          category: document.getElementById('work-category').value,
          imageUrl: imageUrl,
          videoUrl: document.getElementById('work-video').value || '',
          createdAt: serverTimestamp()
        });

        e.target.reset();
        loadAdminPortfolio();
      } catch (err) {
        alert("Upload failed: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'COMPRESS & PUBLISH TO WEBSITE';
      }
    });

    async function loadAdminPortfolio() {
      const grid = document.getElementById('admin-portfolio-grid');
      const q = query(collection(db, "portfolio"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      grid.innerHTML = snap.docs.map(d => {
        const item = d.data();
        return `
          <div class="glass rounded-2xl overflow-hidden relative group">
            <img src="${item.imageUrl}" class="w-full h-40 object-cover">
            <div class="p-3">
              <p class="text-[9px] tracking-widest text-zinc-400 uppercase">${item.category}</p>
              <p class="text-xs font-medium truncate">${item.title}</p>
              <button onclick="deleteDocItem('portfolio', '${d.id}')" class="mt-2 w-full py-1.5 rounded-lg bg-red-500/20 text-red-300 text-[10px] tracking-widest hover:bg-red-500/40">
                DELETE
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadAdminBookings() {
      const tbody = document.getElementById('admin-bookings-list');
      const q = query(collection(db, "bookings"), orderBy("date", "asc"));
      const snap = await getDocs(q);
      tbody.innerHTML = snap.docs.map(d => {
        const b = d.data();
        const isConfirmed = b.status === 'confirmed';
        return `
          <tr class="hover:bg-white/[0.02]">
            <td class="p-4 font-semibold">${b.date}</td>
            <td class="p-4">${b.clientName}<br><span class="text-zinc-400 text-[11px]">${b.phone}</span></td>
            <td class="p-4">${b.package}</td>
            <td class="p-4 text-zinc-400 max-w-xs truncate">${b.notes || '-'}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-[10px] tracking-widest uppercase ${isConfirmed ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">
                ${b.status}
              </span>
            </td>
            <td class="p-4 text-right space-x-2">
              ${!isConfirmed ? `<button onclick="confirmBooking('${d.id}')" class="px-3 py-1.5 bg-white text-black rounded-lg text-[10px] font-semibold tracking-wider">CONFIRM</button>` : ''}
              <button onclick="deleteDocItem('bookings', '${d.id}')" class="px-3 py-1.5 bg-red-500/20 text-red-300 rounded-lg text-[10px] tracking-wider">DELETE</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.confirmBooking = async (id) => {
      await updateDoc(doc(db, "bookings", id), { status: 'confirmed' });
      loadAdminBookings();
    };

    document.getElementById('block-date-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "bookings"), {
        clientName: document.getElementById('manual-note').value || 'Manual Block',
        phone: '-',
        date: document.getElementById('manual-date').value,
        package: 'Direct Booking',
        notes: 'Locked by Admin',
        status: 'confirmed',
        createdAt: serverTimestamp()
      });
      e.target.reset();
      loadAdminBookings();
    });

    document.getElementById('add-package-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const featuresArray = document.getElementById('pkg-features').value.split(',').map(s => s.trim()).filter(Boolean);
      await addDoc(collection(db, "packages"), {
        name: document.getElementById('pkg-name').value,
        category: document.getElementById('pkg-cat').value,
        price: document.getElementById('pkg-price').value,
        features: featuresArray
      });
      e.target.reset();
      loadAdminPackages();
    });

    async function loadAdminPackages() {
      const list = document.getElementById('admin-packages-list');
      const snap = await getDocs(collection(db, "packages"));
      list.innerHTML = snap.docs.map(d => {
        const p = d.data();
        return `
          <div class="glass p-6 rounded-2xl flex flex-col justify-between">
            <div>
              <span class="text-[10px] tracking-widest text-zinc-400">${p.category}</span>
              <h4 class="text-base font-medium mt-1">${p.name}</h4>
              <p class="text-lg font-light my-2">LKR ${p.price}</p>
            </div>
            <button onclick="deleteDocItem('packages', '${d.id}')" class="mt-4 w-full py-2 rounded-xl bg-red-500/20 text-red-300 text-[10px] tracking-widest">
              REMOVE PACKAGE
            </button>
          </div>
        `;
      }).join('');
    }

    window.deleteDocItem = async (colName, id) => {
      if (!confirm("Are you sure?")) return;
      await deleteDoc(doc(db, colName, id));
      loadAllAdminData();
    };

    function loadAllAdminData() {
      loadAdminBookings();
      loadAdminPortfolio();
      loadAdminPackages();
    }
  </script>
</body>
</html>
